# Coolify: create a "Docker Compose" resource from this repo (base directory "/").
# SERVICE_* variables are generated by Coolify once and kept across deploys.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_64_POSTGRES}
      - POSTGRES_DB=authkeep
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      - SERVICE_URL_API_3000
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/authkeep
      - API_KEYS=${SERVICE_PASSWORD_64_APIKEY}
      # Back this value up. If it changes, stored secrets can no longer be decrypted.
      - ENCRYPTION_KEY=${SERVICE_PASSWORD_64_ENCRYPTION}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      - SERVICE_URL_WEB_3000
      - API_URL=http://api:3000
      - API_KEY=${SERVICE_PASSWORD_64_APIKEY}
      - WEB_PASSWORD=${SERVICE_PASSWORD_WEBPASSWORD}
      - SESSION_SECRET=${SERVICE_PASSWORD_64_SESSION}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
